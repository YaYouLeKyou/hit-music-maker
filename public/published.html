<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracks Publiés - Music Hit Maker Studio</title>
    <!-- ============ DESIGN SYSTEM : Tailwind CSS + Font Awesome ============ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        night: "#12101f",
                        panel: "#1c1836",
                        "panel-2": "#221d42",
                        "panel-3": "#181430"
                    },
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Composants de la page (classes consommées par le script inline ci-dessous) -->
    <style>
        * { box-sizing: border-box; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.25rem 1.5rem;
            background-color: #1c1836;
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 1rem;
            box-shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.55);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background-image: linear-gradient(to right, #f0abfc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 0.625rem;
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .back-link:hover {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateX(-2px);
        }
        .back-link:focus-visible { outline: none; box-shadow: 0 0 0 2px #f0abfc; }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background-color: #1c1836;
            border: 1px solid rgba(88, 28, 135, 0.5);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(217, 70, 239, 0.4);
            box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.55);
        }

        /* --- En-tête de carte : petite pochette + titre côte à côte --- */
        .track-main {
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }
        .track-cover {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 0.75rem;
            overflow: hidden;
            background: linear-gradient(135deg, #221d42, #12101f);
            border: 1px solid rgba(139, 92, 246, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.6);
        }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .track-meta { min-width: 0; flex: 1; }
        .track-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .track-artist {
            font-size: 0.8125rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Lecteur audio stylé --- */
        .audio-player {
            width: 100%;
            height: 40px;
            margin: 0.875rem 0 1rem;
            border-radius: 0.625rem;
            accent-color: #d946ef;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .btn-group { display: flex; gap: 0.625rem; flex-wrap: wrap; }

        .btn {
            flex: 1;
            min-width: 90px;
            padding: 0.625rem 0.875rem;
            border: none;
            border-radius: 0.625rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(240, 171, 252, 0.9); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            box-shadow: 0 4px 12px -4px rgba(59, 130, 246, 0.5);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.45);
        }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.85); color: #ffffff; }

        .audio-missing {
            text-align: center;
            color: #f87171;
            font-size: 0.875rem;
            margin: 0.5rem 0 1rem;
        }

        .empty-state { text-align: center; padding: 4rem 1.25rem; color: #94a3b8; grid-column: 1 / -1; }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1.25rem; opacity: 0.7; }
        .empty-state-title { font-size: 1.25rem; font-weight: 700; color: #e2e8f0; margin-bottom: 0.5rem; }
        .empty-state-text { font-size: 0.875rem; max-width: 26rem; margin: 0 auto; line-height: 1.6; }

        @media (max-width: 768px) {
            .tracks-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            h1 { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }

        /* Carte active pendant la lecture */
        .track-card.playing {
            border-color: rgba(217, 70, 239, 0.75);
            box-shadow: 0 0 0 1px rgba(217, 70, 239, 0.4), 0 18px 36px -12px rgba(0, 0, 0, 0.55);
        }

        /* Bouton play sur chaque carte */
        .play-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            box-shadow: 0 4px 12px -4px rgba(217, 70, 239, 0.5);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .play-btn:hover { transform: scale(1.06); }
        .play-btn.disabled { opacity: 0.4; background: #3f3a5f; cursor: not-allowed; }
        .play-btn:active { transform: scale(0.94); }

        /* ==================== BARRE LECTEUR STICKY ==================== */
        .player-bar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            display: none;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            background: rgba(28, 24, 54, 0.97);
            border-top: 1px solid rgba(139, 92, 246, 0.35);
            box-shadow: 0 -12px 32px -14px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }
        .player-bar.visible { display: flex; }

        .player-info { min-width: 0; flex: 1 1 auto; }
        .player-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-artist {
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls { display: flex; align-items: center; gap: 0.35rem; }
        .pc-btn {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .pc-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .pc-btn:active { transform: scale(0.9); }
        .pc-btn-big { background: linear-gradient(135deg, #d946ef, #8b5cf6); color: #fff; }
        .pc-btn-big:hover { background: linear-gradient(135deg, #e879f9, #a78bfa); }

        .player-progress {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex: 0 0 auto;
            width: min(320px, 30%);
        }
        .player-progress input[type="range"] {
            flex: 1;
            accent-color: #d946ef;
            min-width: 80px;
            cursor: pointer;
        }
        .player-time { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; }

        @media (max-width: 640px) {
            .player-bar { flex-wrap: wrap; gap: 0.6rem; padding: 0.6rem 0.75rem; }
            .player-progress { width: 100%; order: 4; }
            .player-controls { order: 3; }
            .player-info { order: 2; }
            .track-cover { order: 1; }
        }
        body { padding-bottom: 90px; }
        button, a, [role="button"] { -webkit-tap-highlight-color: transparent; }
        body { overflow-x: hidden; }

        @media (max-width: 640px) {
            input, select, textarea { font-size: 16px !important; }
            header nav a,
            .btn { min-height: 44px; }
        }

        @media (max-width: 360px) {
            .tracks-grid { grid-template-columns: 1fr; }
            .track-cover { width: 52px; height: 52px; font-size: 1.25rem; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1b31; }
        ::-webkit-scrollbar-thumb { background: #4c3f91; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6d5bb5; }
    </style>
</head>
<body class="bg-night text-slate-100 min-h-screen font-sans antialiased py-8">
    <div class="container">
        <header>
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Retour au Studio
            </a>
            <h1><i class="fa-solid fa-compact-disc mr-2"></i>Tracks Publiés</h1>
        </header>
        
        <div id="tracks-container" class="tracks-grid">
            <!-- Tracks will be loaded here -->
        </div>
    </div>

    <!-- ==================== LECTEUR GLOBAL (barre sticky) ==================== -->
    <audio id="global-audio" preload="none"></audio>
    <div id="player-bar" class="player-bar">
        <div class="track-cover" id="bar-cover">🎵</div>
        <div class="player-info">
            <div class="player-title" id="bar-title">—</div>
            <div class="player-artist" id="bar-artist"></div>
        </div>
        <div class="player-controls">
            <button id="bar-prev" title="Précédent" class="pc-btn"><i class="fa-solid fa-backward-step"></i></button>
            <button id="bar-play" title="Lecture / Pause" class="pc-btn pc-btn-big"><i class="fa-solid fa-play" id="bar-play-icon"></i></button>
            <button id="bar-next" title="Suivant" class="pc-btn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
        <div class="player-progress">
            <input type="range" id="bar-progress" min="0" max="100" value="0" step="0.1" aria-label="Progression">
            <span class="player-time" id="bar-time">0:00 / 0:00</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tracksContainer = document.getElementById('tracks-container');
            
            // Load published tracks from localStorage
            let publishedTracks = [];
            try {
                const stored = localStorage.getItem('publishedTracks');
                publishedTracks = stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Error loading published tracks:', e);
                publishedTracks = [];
            }
            
            if (publishedTracks.length === 0) {
                tracksContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎵</div>
                        <div class="empty-state-title">Aucun track publié pour le moment</div>
                        <p class="empty-state-text">
                            Utilisez le studio pour créer de la musique, puis publiez-la pour la voir apparaître ici.
                        </p>
                    </div>
                `;
                return;
            }
            
            // Render tracks
            // Chaque carte a un bouton play qui pilote le lecteur GLOBAL.
            tracksContainer.innerHTML = publishedTracks.map((track, index) => {
                // Handle cover image loading errors
                const coverImg = track.coverUrl 
                    ? `<img src="${track.coverUrl}" alt="Cover for ${track.title || 'Track'}" onerror="this.onerror=null; this.parentNode.innerHTML='🎵';">`
                    : '🎵';

                const hasAudio = !!(track.audioUrl || track.streamAudioUrl);

                return `
                    <div class="track-card" data-track-id="${track.id}" data-index="${index}">
                        <div class="track-main">
                            <button class="play-btn ${hasAudio ? '' : 'disabled'}" data-action="play" data-index="${index}" title="${hasAudio ? 'Lire cette chanson' : 'Audio non disponible'}">
                                <i class="fa-solid fa-play"></i>
                            </button>
                            <div class="track-cover">
                                ${coverImg}
                            </div>
                            <div class="track-meta">
                                <h3 class="track-title">${track.title || 'Sans titre'}</h3>
                                ${track.artistUsed ? `<p class="track-artist"><i class="fa-solid fa-microphone-lines mr-1"></i>${track.artistUsed}</p>` : ''}
                            </div>
                        </div>
                        ${!hasAudio ? `<p class="audio-missing"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Audio non disponible</p>` : ''}
                        <div class="btn-group">
                            ${hasAudio ? 
                                `<a href="${track.audioUrl || track.streamAudioUrl}" download="${(track.title || 'track').replace(/[^a-z0-9]/gi, '_')}.mp3" class="btn btn-download">
                                    <i class="fa-solid fa-download"></i> Télécharger
                                </a>` : 
                                `<button class="btn btn-download" disabled>
                                    <i class="fa-solid fa-download"></i> Télécharger
                                </button>`
                            }
                            <button class="btn btn-delete" onclick="deleteTrack('${track.id}')">
                                <i class="fa-solid fa-trash-can"></i> Supprimer
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // --- Lecteur global + auto-enchaînement ---
            setupPlayer(publishedTracks);
        });
        
        // ============================================================
        // LECTEUR GLOBAL — un seul <audio> + barre sticky en bas
        // ============================================================
        function setupPlayer(tracks) {
            const list = tracks.filter(t => !!(t.audioUrl || t.streamAudioUrl));
            const audioEl = document.getElementById('global-audio');
            const playIcon = document.getElementById('bar-play-icon');
            const prevBtn = document.getElementById('bar-prev');
            const nextBtn = document.getElementById('bar-next');
            const prog = document.getElementById('bar-progress');
            const timeEl = document.getElementById('bar-time');
            const titleEl = document.getElementById('bar-title');
            const artistEl = document.getElementById('bar-artist');
            const coverEl = document.getElementById('bar-cover');
            const bar = document.getElementById('player-bar');

            let current = -1; // index dans `list`

            // Index d'affichage (pour retrouver la carte active)
            const displayIndexOf = (listIndex) => {
                const track = list[listIndex];
                if (!track) return -1;
                const card = document.querySelector(`.track-card[data-track-id="${track.id}"]`);
                return card ? parseInt(card.dataset.index, 10) : -1;
            };

            function updateBar() {
                if (current < 0 || !list[current]) return;
                const track = list[current];
                titleEl.textContent = track.title || 'Sans titre';
                artistEl.textContent = track.artistUsed || '';
                coverEl.innerHTML = track.coverUrl
                    ? `<img src="${track.coverUrl}" alt="" onerror="this.onerror=null; this.parentNode.innerHTML='🎵';">`
                    : '🎵';
                bar.classList.add('visible');
                updateActiveCard();
            }

            function updateActiveCard() {
                document.querySelectorAll('.track-card').forEach(c => c.classList.remove('playing'));
                const idx = displayIndexOf(current);
                if (idx >= 0) {
                    document.querySelector(`.track-card[data-index="${idx}"]`)?.classList.add('playing');
                }
                document.querySelectorAll('.play-btn[data-index]').forEach(b => {
                    b.innerHTML = (parseInt(b.dataset.index, 10) === idx && !audioEl.paused)
                        ? '<i class="fa-solid fa-pause"></i>'
                        : '<i class="fa-solid fa-play"></i>';
                });
            }

            function loadAndPlay(listIndex, start) {
                if (listIndex < 0 || listIndex >= list.length) return;
                current = listIndex;
                audioEl.src = list[listIndex].audioUrl || list[listIndex].streamAudioUrl;
                audioEl.currentTime = 0;
                if (start) audioEl.play().catch(() => {});
                updateBar();
            }

            function playPause() {
                if (current < 0) { loadAndPlay(0, true); return; }
                if (audioEl.paused) audioEl.play().catch(() => {}); else audioEl.pause();
            }

            function next(autoStart) {
                const n = list.length ? (current + 1) % list.length : 0;
                loadAndPlay(n, autoStart === undefined ? true : autoStart);
            }

            function prev() {
                if (audioEl.currentTime > 3) { audioEl.currentTime = 0; return; }
                const p = current <= 0 ? list.length - 1 : current - 1;
                loadAndPlay(p, true);
            }

            // Clic sur les boutons play des cartes
            document.querySelectorAll('.play-btn[data-index]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.classList.contains('disabled')) return;
                    const idx = parseInt(btn.dataset.index, 10);
                    const track = tracks[idx];
                    const listIndex = list.findIndex(t => t.id === track.id);
                    if (current === listIndex && !audioEl.paused) {
                        audioEl.pause();
                    } else {
                        loadAndPlay(listIndex, true);
                    }
                });
            });

            // Contrôles de la barre
            document.getElementById('bar-play').addEventListener('click', playPause);
            prevBtn.addEventListener('click', prev);
            nextBtn.addEventListener('click', () => next(true));

            // Barre de progression
            audioEl.addEventListener('timeupdate', () => {
                if (!audioEl.duration) return;
                prog.value = (audioEl.currentTime / audioEl.duration) * 100;
                const mm = Math.floor(audioEl.currentTime / 60);
                const ss = String(Math.floor(audioEl.currentTime % 60)).padStart(2, '0');
                const tm = Math.floor(audioEl.duration / 60);
                const ts = String(Math.floor(audioEl.duration % 60)).padStart(2, '0');
                timeEl.textContent = `${mm}:${ss} / ${tm}:${ts}`;
            });
            prog.addEventListener('input', () => {
                if (!audioEl.duration) return;
                audioEl.currentTime = (prog.value / 100) * audioEl.duration;
            });

            // États play/pause (icône globale + carte active)
            audioEl.addEventListener('play', () => { playIcon.className = 'fa-solid fa-pause'; updateActiveCard(); });
            audioEl.addEventListener('pause', () => { playIcon.className = 'fa-solid fa-play'; updateActiveCard(); });

            // AUTO-ENCHAÎNEMENT : fin d'une piste -> la suivante démarre
            audioEl.addEventListener('ended', () => { next(true); });

            // Libération sur déchargement
            window.addEventListener('beforeunload', () => {
                audioEl.pause();
                audioEl.removeAttribute('src');
                audioEl.load();
            });
        }

        function deleteTrack(trackId) {
            if (!confirm("Êtes-vous sûr de vouloir supprimer ce track publié ? Cette action est irréversible.")) {
                return;
            }
            
            try {
                const tracks = JSON.parse(localStorage.getItem('publishedTracks') || '[]');
                const filtered = tracks.filter(track => track.id !== trackId);
                localStorage.setItem('publishedTracks', JSON.stringify(filtered));
                
                // Show success message
                showToast('Track supprimé avec succès', 'success');
                
                // Reload the page to reflect changes
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } catch (error) {
                console.error('Error deleting track:', error);
                showToast('Erreur lors de la suppression', 'danger');
            }
        }
        
        function showToast(message, type = 'success') {
            // Remove any existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = `toast fixed bottom-4 right-4 p-4 rounded-lg shadow-lg z-50 max-w-xs`;
            
            const bgColors = {
                success: 'bg-success/90',
                danger: 'bg-danger/90',
                info: 'bg-info/90'
            };
            
            const textColors = {
                success: 'text-white',
                danger: 'text-white',
                info: 'text-white'
            };
            
            toast.className += ` ${bgColors[type] || bgColors.info} ${textColors[type] || textColors.info}`;
            toast.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="flex-shrink-0">
                        ${type === 'success' ? '✅' : type === 'danger' ? '❌' : 'ℹ️'}
                    </div>
                    <div>
                        <div class="font-medium">${message}</div>
                    </div>
                </div>
            `;
            
            // Add temporary styles for positioning (since we don't have Tailwind JS)
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '1rem',
                right: '1rem',
                padding: '1rem',
                borderRadius: '0.5rem',
                boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)',
                zIndex: '9999',
                maxWidth: '24rem'
            });
            
            // Set background and text color based on type
            if (type === 'success') {
                toast.style.backgroundColor = 'rgba(16, 185, 129, 0.9)';
                toast.style.color = 'white';
            } else if (type === 'danger') {
                toast.style.backgroundColor = 'rgba(239, 68, 68, 0.9)';
                toast.style.color = 'white';
            } else {
                toast.style.backgroundColor = 'rgba(59, 130, 246, 0.9)';
                toast.style.color = 'white';
            }
            
            document.body.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
    </script>
