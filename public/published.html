<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracks Publiés - Music Hit Maker Studio</title>
    <!-- ============ DESIGN SYSTEM : Tailwind CSS + Font Awesome ============ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        night: "#12101f",
                        panel: "#1c1836",
                        "panel-2": "#221d42",
                        "panel-3": "#181430"
                    },
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Composants de la page (classes consommées par le script inline ci-dessous) -->
    <style>
        * { box-sizing: border-box; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 1rem; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.25rem 1.5rem;
            background-color: #1c1836;
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 1rem;
            box-shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.55);
        }

        h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background-image: linear-gradient(to right, #f0abfc, #67e8f9);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 0.625rem;
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .back-link:hover {
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateX(-2px);
        }
        .back-link:focus-visible { outline: none; box-shadow: 0 0 0 2px #f0abfc; }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .track-card {
            background-color: #1c1836;
            border: 1px solid rgba(88, 28, 135, 0.5);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.45);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .track-card:hover {
            transform: translateY(-4px);
            border-color: rgba(217, 70, 239, 0.4);
            box-shadow: 0 18px 36px -12px rgba(0, 0, 0, 0.55);
        }

        /* --- En-tête de carte : petite pochette + titre côte à côte --- */
        .track-main {
            display: flex;
            align-items: center;
            gap: 0.875rem;
        }
        .track-cover {
            width: 64px;
            height: 64px;
            flex-shrink: 0;
            border-radius: 0.75rem;
            overflow: hidden;
            background: linear-gradient(135deg, #221d42, #12101f);
            border: 1px solid rgba(139, 92, 246, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px -4px rgba(0, 0, 0, 0.6);
        }
        .track-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .track-meta { min-width: 0; flex: 1; }
        .track-title {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 0.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .track-artist {
            font-size: 0.8125rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Lecteur audio stylé --- */
        .audio-player {
            width: 100%;
            height: 40px;
            margin: 0.875rem 0 1rem;
            border-radius: 0.625rem;
            accent-color: #d946ef;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .btn-group { display: flex; gap: 0.625rem; flex-wrap: wrap; }

        .btn {
            flex: 1;
            min-width: 90px;
            padding: 0.625rem 0.875rem;
            border: none;
            border-radius: 0.625rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
        .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(240, 171, 252, 0.9); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-download {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            box-shadow: 0 4px 12px -4px rgba(59, 130, 246, 0.5);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.45);
        }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.85); color: #ffffff; }

        .audio-missing {
            text-align: center;
            color: #f87171;
            font-size: 0.875rem;
            margin: 0.5rem 0 1rem;
        }

        .empty-state { text-align: center; padding: 4rem 1.25rem; color: #94a3b8; grid-column: 1 / -1; }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1.25rem; opacity: 0.7; }
        .empty-state-title { font-size: 1.25rem; font-weight: 700; color: #e2e8f0; margin-bottom: 0.5rem; }
        .empty-state-text { font-size: 0.875rem; max-width: 26rem; margin: 0 auto; line-height: 1.6; }

        @media (max-width: 768px) {
            .tracks-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            h1 { font-size: 1.5rem; }
        }
        @media (max-width: 480px) {
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e1b31; }
        ::-webkit-scrollbar-thumb { background: #4c3f91; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6d5bb5; }
    </style>
</head>
<body class="bg-night text-slate-100 min-h-screen font-sans antialiased py-8">
    <div class="container">
        <header>
            <a href="index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Retour au Studio
            </a>
            <h1><i class="fa-solid fa-compact-disc mr-2"></i>Tracks Publiés</h1>
        </header>
        
        <div id="tracks-container" class="tracks-grid">
            <!-- Tracks will be loaded here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tracksContainer = document.getElementById('tracks-container');
            
            // Load published tracks from localStorage
            let publishedTracks = [];
            try {
                const stored = localStorage.getItem('publishedTracks');
                publishedTracks = stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.error('Error loading published tracks:', e);
                publishedTracks = [];
            }
            
            if (publishedTracks.length === 0) {
                tracksContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎵</div>
                        <div class="empty-state-title">Aucun track publié pour le moment</div>
                        <p class="empty-state-text">
                            Utilisez le studio pour créer de la musique, puis publiez-la pour la voir apparaître ici.
                        </p>
                    </div>
                `;
                return;
            }
            
            // Render tracks
            tracksContainer.innerHTML = publishedTracks.map(track => {
                // Handle cover image loading errors
                const coverImg = track.coverUrl 
                    ? `<img src="${track.coverUrl}" alt="Cover for ${track.title || 'Track'}" onerror="this.onerror=null; this.parentNode.innerHTML='🎵';">`
                    : '🎵';

                const player = (track.audioUrl || track.streamAudioUrl)
                    ? `<audio class="audio-player" controls preload="metadata" src="${track.audioUrl || track.streamAudioUrl}">Votre navigateur ne supporte pas l'élément audio.</audio>`
                    : `<p class="audio-missing"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Audio non disponible</p>`;

                return `
                    <div class="track-card" data-track-id="${track.id}">
                        <div class="track-main">
                            <div class="track-cover">
                                ${coverImg}
                            </div>
                            <div class="track-meta">
                                <h3 class="track-title">${track.title || 'Sans titre'}</h3>
                                ${track.artistUsed ? `<p class="track-artist"><i class="fa-solid fa-microphone-lines mr-1"></i>${track.artistUsed}</p>` : ''}
                            </div>
                        </div>
                        ${player}
                        <div class="btn-group">
                            ${(track.audioUrl || track.streamAudioUrl) ? 
                                `<a href="${track.audioUrl || track.streamAudioUrl}" download="${(track.title || 'track').replace(/[^a-z0-9]/gi, '_')}.mp3" class="btn btn-download">
                                    <i class="fa-solid fa-download"></i> Télécharger
                                </a>` : 
                                `<button class="btn btn-download" disabled>
                                    <i class="fa-solid fa-download"></i> Télécharger
                                </button>`
                            }
                            <button class="btn btn-delete" onclick="deleteTrack('${track.id}')">
                                <i class="fa-solid fa-trash-can"></i> Supprimer
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        });
        
        function deleteTrack(trackId) {
            if (!confirm("Êtes-vous sûr de vouloir supprimer ce track publié ? Cette action est irréversible.")) {
                return;
            }
            
            try {
                const tracks = JSON.parse(localStorage.getItem('publishedTracks') || '[]');
                const filtered = tracks.filter(track => track.id !== trackId);
                localStorage.setItem('publishedTracks', JSON.stringify(filtered));
                
                // Show success message
                showToast('Track supprimé avec succès', 'success');
                
                // Reload the page to reflect changes
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } catch (error) {
                console.error('Error deleting track:', error);
                showToast('Erreur lors de la suppression', 'danger');
            }
        }
        
        function showToast(message, type = 'success') {
            // Remove any existing toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) {
                existingToast.remove();
            }
            
            const toast = document.createElement('div');
            toast.className = `toast fixed bottom-4 right-4 p-4 rounded-lg shadow-lg z-50 max-w-xs`;
            
            const bgColors = {
                success: 'bg-success/90',
                danger: 'bg-danger/90',
                info: 'bg-info/90'
            };
            
            const textColors = {
                success: 'text-white',
                danger: 'text-white',
                info: 'text-white'
            };
            
            toast.className += ` ${bgColors[type] || bgColors.info} ${textColors[type] || textColors.info}`;
            toast.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="flex-shrink-0">
                        ${type === 'success' ? '✅' : type === 'danger' ? '❌' : 'ℹ️'}
                    </div>
                    <div>
                        <div class="font-medium">${message}</div>
                    </div>
                </div>
            `;
            
            // Add temporary styles for positioning (since we don't have Tailwind JS)
            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '1rem',
                right: '1rem',
                padding: '1rem',
                borderRadius: '0.5rem',
                boxShadow: '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)',
                zIndex: '9999',
                maxWidth: '24rem'
            });
            
            // Set background and text color based on type
            if (type === 'success') {
                toast.style.backgroundColor = 'rgba(16, 185, 129, 0.9)';
                toast.style.color = 'white';
            } else if (type === 'danger') {
                toast.style.backgroundColor = 'rgba(239, 68, 68, 0.9)';
                toast.style.color = 'white';
            } else {
                toast.style.backgroundColor = 'rgba(59, 130, 246, 0.9)';
                toast.style.color = 'white';
            }
            
            document.body.appendChild(toast);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
