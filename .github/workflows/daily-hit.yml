name: Chanson du Jour (Facebook + Instagram)

on:
  # Publication automatique tous les jours à 12h00 heure de Paris (10h00 UTC)
  schedule:
    - cron: "0 10 * * *"
  # Déclenchement manuel possible depuis l'onglet Actions
  workflow_dispatch:

jobs:
  publish-daily-hit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      - name: Génération et publication de la Chanson du Jour
        env:
          # --- Génération (LLM + pochette) ---
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          BANANA_API_KEY: ${{ secrets.BANANA_API_KEY }}
          # --- Notification Discord (optionnel) ---
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # --- Facebook ---
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # --- Instagram ---
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node cron_daily.js

      - name: Upload de l'artefact (hit + pochette)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hit-du-jour
          path: hits/
          retention-days: 30